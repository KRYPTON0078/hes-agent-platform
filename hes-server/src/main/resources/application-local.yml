spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:hes;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # RocketMQ is optional in local profile; producers/consumers use no-op when broker is down
hes:
  rocketmq:
    enabled: false
  agent:
    heartbeat-ttl-seconds: 90
    command-timeout-seconds: 30

spring.autoconfigure.exclude: >
  org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration,
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

management:
  health:
    redis:
      enabled: false

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: hes-server-producer
