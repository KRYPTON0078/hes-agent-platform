spring:
  application:
    name: hes-server
  profiles:
    default: local

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: HES Agent Platform
    description: Home Energy Storage Agent backend
    version: 0.1.0-SNAPSHOT

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.hes: DEBUG

hes:
  security:
    jwt:
      secret: ${HES_JWT_SECRET:local-dev-only-change-me-32b-min-secret!!}
      access-ttl-seconds: 900
      refresh-ttl-seconds: 604800
    auth:
      max-failed-logins: 5
      lock-minutes: 15
    agent:
      max-failed-auths: 8
      lock-seconds: 300
    rate-limit:
      per-minute: 120
